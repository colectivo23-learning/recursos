<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recursos Colectivo23</title>
  <meta name="description" content="Recursos gratuitos de Colectivo23: formación de profesionales para profesionales.">
  <link rel="icon" href="assets/logos/monograma-azul.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;900&family=EB+Garamond:ital@1&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --electric-blue: #0037ff;
      --dark-blue: #001c95;
      --white: #ffffff;
      --gradient-electric-flow: linear-gradient(135deg, #0037ff, #001c95);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--gradient-electric-flow);
      color: var(--white);
      font-family: "Poppins", "Helvetica Neue", Arial, sans-serif;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 48px 24px;
    }
    .logo { width: min(320px, 70vw); height: auto; }
    main { max-width: 760px; }
    .label {
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-weight: 500;
      font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 16px;
    }
    h1 {
      font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em;
      font-size: clamp(40px, 9vw, 72px); line-height: 1; margin: 0 0 24px;
    }
    .quote {
      font-family: "EB Garamond", Garamond, serif; font-style: italic;
      font-size: clamp(22px, 4vw, 28px); line-height: 1.3; margin: 0;
    }
    a { color: var(--white); }
    footer { font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="assets/logos/logotipo-descriptor-blanco.svg" alt="Colectivo23">
  </header>
  <main>
    <p class="label">Recursos gratuitos · Muy pronto</p>
    <h1>Evoluciona en colectivo</h1>
    <p class="quote">La teoría explica. La práctica revela.</p>
  </main>
  <footer>
    <a href="https://colectivo23.com">colectivo23.com</a>
  </footer>
</body>
</html>
